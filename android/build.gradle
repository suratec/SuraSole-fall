// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        googlePlayServicesVersion = "+"
        firebaseMessagingVersion = "21.1.0"

        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35

        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.1.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.0")
        classpath('com.google.gms:google-services:4.3.3')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    tasks.configureEach { task ->
        if (task.name.contains("buildCMake") || task.name.contains("generateJsonModel")) {
            task.doFirst {
                def cacheDir = new File(System.getProperty("user.home"), ".gradle/caches/8.13/transforms")
                if (cacheDir.exists()) {
                    cacheDir.eachFileRecurse { file ->
                        if (file.name == "graphicsConversions.h" && file.path.contains("prefab") && file.path.contains("reactnative")) {
                            def content = file.text
                            if (content.contains("std::format")) {
                                println "Patching ${file.path}..."
                                content = content.replace("std::format(\"{}%\", dimension.value)", "std::to_string(dimension.value) + \"%\"")
                                if (!content.contains("#include <string>")) {
                                    content = content.replace("#include <array>", "#include <array>\n#include <string>")
                                }
                                file.text = content
                            }
                        }
                    }
                }
            }
        }
    }
}
