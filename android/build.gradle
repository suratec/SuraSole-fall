// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        googlePlayServicesVersion = "+"
        firebaseMessagingVersion = "21.1.0"

        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 35

        ndkVersion = "28.2.13676358"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath('com.google.gms:google-services:4.4.2')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            exclude group: "com.google.guava", module: "listenablefuture"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    tasks.configureEach { task ->
        if (task.name.contains("buildCMake") || task.name.contains("generateJsonModel")) {
            task.doFirst {
                def gradleHome = gradle.getGradleUserHomeDir()
                def cacheDirs = [
                    new File(gradleHome, "caches/8.13/transforms"),
                    new File("D:/.gradle/caches/8.13/transforms"),
                    new File(System.getProperty("user.home"), ".gradle/caches/8.13/transforms")
                ]
                
                cacheDirs.unique().each { cacheDir ->
                    if (cacheDir.exists()) {
                        cacheDir.eachFileRecurse { file ->
                            if (file.name == "graphicsConversions.h" && file.path.contains("prefab") && file.path.contains("reactnative")) {
                                def content = file.text
                                if (content.contains("std::format")) {
                                    println "Patching ${file.path}..."
                                    content = content.replace("std::format(\"{}%\", dimension.value)", "std::to_string(dimension.value) + \"%\"")
                                    if (!content.contains("#include <string>")) {
                                        content = content.replace("#include <array>", "#include <array>\n#include <string>")
                                    }
                                    file.text = content
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

allprojects {
    tasks.configureEach { task ->
        if (task.name.contains("configureCMake") || task.name.contains("generateJsonModel")) {
            task.doFirst {
                // Patch react-native-worklets CMakeLists.txt for NDK 27 c++_shared compatibility
                def workletsCMake = new File("${rootProject.projectDir}/../node_modules/react-native-worklets/android/CMakeLists.txt")
                if (workletsCMake.exists()) {
                    def content = workletsCMake.text
                    if (!content.contains("c++_shared") && content.contains("fbjni::fbjni)")) {
                        println "Patching react-native-worklets CMakeLists.txt for NDK 27 c++_shared compatibility..."
                        content = content.replace("fbjni::fbjni)", "fbjni::fbjni c++_shared)")
                        workletsCMake.text = content
                    }
                }

                // Patch react-native-reanimated CMakeLists.txt for NDK 27 c++_shared compatibility
                def reanimatedCMake = new File("${rootProject.projectDir}/../node_modules/react-native-reanimated/android/CMakeLists.txt")
                if (reanimatedCMake.exists()) {
                    def content = reanimatedCMake.text
                    if (!content.contains("c++_shared") && content.contains("worklets)")) {
                        println "Patching react-native-reanimated CMakeLists.txt for NDK 27 c++_shared compatibility..."
                        content = content.replace("worklets)", "worklets\n  c++_shared)")
                        reanimatedCMake.text = content
                    }
                }
            }
        }
    }
}
